name: Release

# Arquiva e envia para o TestFlight quando você cria uma tag de versão.
# Exemplo: git tag v1.0.0 && git push origin v1.0.0
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID       -> App Store Connect > Users and Access > Keys
#   ASC_ISSUER_ID    -> mesmo lugar (ID do issuer da chave)
#   ASC_PRIVATE_KEY  -> conteúdo do arquivo .p8 da chave
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  SCHEME: DescontaAi
  PROJECT: DescontaAi.xcodeproj
  DESTINATION: "generic/platform=iOS"

jobs:
  testflight:
    name: Upload to TestFlight
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_27.2.app

      - name: Set up App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -archivePath "$RUNNER_TEMP/DescontaAi.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=JH2S85224M \
            | xcbeautify

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          xcrun altool --upload-app \
            --file "$RUNNER_TEMP/DescontaAi.xcarchive/Products/Applications/DescontaAi.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --type ios \
            --verbose
